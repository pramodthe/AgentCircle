[project]
name = "agentcircle-api"
version = "0.1.0"
description = "Persistent social context and agent negotiation API for AgentCircle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.2,<5.0",
  "beautifulsoup4>=4.12,<5.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langsmith>=0.3.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt>=2.9,<3.0",
  "pymongo>=4.13,<5.0",
  "pypdf>=5.1,<6.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1.1,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "mongomock>=4.3,<5.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
