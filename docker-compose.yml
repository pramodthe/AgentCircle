services:
  mongodb:
    image: mongo:8.0
    container_name: agentcircle-mongodb
    ports:
      - "27017:27017"
    volumes:
      - agentcircle_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agentcircle_mongodb_data:
